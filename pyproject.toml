[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cage"
version = "0.1.0"
description = "Application-first packager and runner for Wine/Proton-family software"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Pelagians" }
]
keywords = ["wine", "proton", "oci", "packaging", "cage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Emulators",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
releases = ["cryptography>=43"]
dev = [
  "pytest>=7.0",
]

[project.urls]
Repository = "https://github.com/pelagians/Cage"

[project.scripts]
cage = "cage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cage*", "artifact*", "builder*", "compat*", "container*", "core*", "runtime*"]
exclude = ["tests*", "docs*", "examples*", "cmd*"]
namespaces = false

[tool.setuptools.package-data]
"compat.corpus" = ["*.json"]
runtime = ["catalog.json", "desktop-wine-11.0.json", "wine-arm64ec-11.20-fex-2610.json", "macos-metalsharp-v2.0.json", "appimage-tools.json", "patches/*.patch", "vendor/fex-2610-cage1/*", "vendor/wine-11.20-exit1/*", "legacy/*.json"]
"core.chocolatey.assets" = ["*.sh", "*.ps1", "*.nupkg", "*.py", "*.json"]
container = [
  "build.sh",
  "docker-compose.yml",
  "common/*.sh",
  "runtimes/*/Dockerfile",
  "runtimes/*/*.py",
  "selkies/root/defaults/*",
  "selkies/root/custom-cont-init.d/*",
  "selkies/root/usr/local/libexec/*",
  "selkies/root/usr/local/bin/*",
  "selkies/root/etc/s6-overlay/s6-rc.d/*/run",
  "selkies/root/etc/s6-overlay/s6-rc.d/*/type",
  "selkies/root/etc/s6-overlay/s6-rc.d/*/dependencies.d/*",
  "selkies/root/etc/s6-overlay/s6-rc.d/user/contents.d/*",
]

[tool.cage]
schema_version = "cage.app/v0"

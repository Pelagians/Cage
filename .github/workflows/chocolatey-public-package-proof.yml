name: Chocolatey Public Package Proof

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**/*.cage.yaml'
      - 'core/chocolatey/**'
      - 'core/modules/**'
      - 'artifact/**'
      - 'builder/**'
      - 'cage/**'
      - 'runtime/**'
      - 'pyproject.toml'
      - '.github/workflows/chocolatey-public-package-proof.yml'
  pull_request:
    paths:
      - 'recipes/**/*.cage.yaml'
      - 'core/chocolatey/**'
      - 'core/modules/**'
      - 'artifact/**'
      - 'builder/**'
      - 'cage/**'
      - 'runtime/**'
      - 'pyproject.toml'
      - '.github/workflows/chocolatey-public-package-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  runtime-profile:
    name: Resolve pinned CFW Wine 11 runtime
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.runtime.outputs.available }}
      image: ${{ steps.runtime.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve released CFW runtime profile
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from core.modules.chocolatey import DEFAULT_CFW_RUNTIME_ARTIFACT
          artifact = DEFAULT_CFW_RUNTIME_ARTIFACT
          print(f"available={'true' if artifact else 'false'}")
          print(f"image={artifact['wineImage'] if artifact else ''}")
          PY

      - name: Fail closed when the pinned runtime is unavailable
        if: steps.runtime.outputs.available != 'true'
        run: |
          echo 'No released, digest-pinned CFW Wine 11 runtime is available.'
          echo 'CFW runtime construction belongs to Chocolatey-for-Wine, not this consumer proof.'
          exit 78

  public-packages:
    name: Build and prove public Chocolatey packages
    needs: runtime-profile
    if: needs.runtime-profile.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CAGE_RUNTIME_IMAGE: ${{ needs.runtime-profile.outputs.image }}
      CAGE_MODULE_CACHE: ${{ github.workspace }}/.cage-module-cache
      CAGE_BUILD_TIMEOUT: '7200'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Cage
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore shared Chocolatey module cache
        uses: actions/cache@v4
        with:
          path: .cage-module-cache
          key: cage-chocolatey-modules-${{ runner.os }}-${{ hashFiles('core/chocolatey/assets/**', 'core/modules/chocolatey.py') }}
          restore-keys: |
            cage-chocolatey-modules-${{ runner.os }}-

      - name: Pull pinned CFW Wine 11 image
        run: docker pull "$CAGE_RUNTIME_IMAGE"

      - name: Inspect recipes before building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cage inspect recipes/7zip.cage.yaml > evidence/7zip-recipe-inspection.json
          cage inspect recipes/notepadplusplus.cage.yaml > evidence/notepadplusplus-recipe-inspection.json

      - name: Build and prove 7zip against the public Chocolatey feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-7zip evidence logs
          set +e
          cage build recipes/7zip.cage.yaml \
            --output dist-7zip \
            --engine docker \
            --image-tag "$CAGE_RUNTIME_IMAGE" \
            --module-cache-dir "$CAGE_MODULE_CACHE" \
            --build-timeout "$CAGE_BUILD_TIMEOUT" 2>&1 | tee logs/7zip-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "7zip build failed with exit code $rc" >&2
            exit "$rc"
          fi
          bundle="$(find dist-7zip -mindepth 1 -maxdepth 1 -type d ! -name .cage -print -quit)"
          test -n "$bundle"
          cage bundle inspect "$bundle" > evidence/7zip-bundle-inspection.json
          cage bundle verify "$bundle" > evidence/7zip-bundle-verification.json
          test -s "$bundle/metadata/chocolatey-package-evidence.json"
          cp "$bundle/metadata/chocolatey-package-evidence.json" evidence/7zip-package-evidence.json
          cage run --dry-run --graphics headless "$bundle" > evidence/7zip-launch-evidence.json
          test -s evidence/7zip-launch-evidence.json
          tar -czf evidence/7zip-bundle.tar.gz -C "$(dirname "$bundle")" "$(basename "$bundle")"

      - name: Build and prove Notepad++ against the public Chocolatey feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-notepadplusplus evidence logs
          set +e
          cage build recipes/notepadplusplus.cage.yaml \
            --output dist-notepadplusplus \
            --engine docker \
            --image-tag "$CAGE_RUNTIME_IMAGE" \
            --module-cache-dir "$CAGE_MODULE_CACHE" \
            --build-timeout "$CAGE_BUILD_TIMEOUT" 2>&1 | tee logs/notepadplusplus-build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Notepad++ build failed with exit code $rc" >&2
            exit "$rc"
          fi
          bundle="$(find dist-notepadplusplus -mindepth 1 -maxdepth 1 -type d ! -name .cage -print -quit)"
          test -n "$bundle"
          cage bundle inspect "$bundle" > evidence/notepadplusplus-bundle-inspection.json
          cage bundle verify "$bundle" > evidence/notepadplusplus-bundle-verification.json
          test -s "$bundle/metadata/chocolatey-package-evidence.json"
          cp "$bundle/metadata/chocolatey-package-evidence.json" evidence/notepadplusplus-package-evidence.json
          cage run --dry-run --graphics headless "$bundle" > evidence/notepadplusplus-launch-evidence.json
          test -s evidence/notepadplusplus-launch-evidence.json
          tar -czf evidence/notepadplusplus-bundle.tar.gz -C "$(dirname "$bundle")" "$(basename "$bundle")"

      - name: Upload public-package proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocolatey-public-package-proof-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            evidence/**
            logs/**
            dist-7zip/**/logs/**
            dist-7zip/**/metadata/**
            dist-notepadplusplus/**/logs/**
            dist-notepadplusplus/**/metadata/**

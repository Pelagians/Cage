# workflow to build and push Cage runtime container images to ghcr.io
name: Build Cage Runtime Containers

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'runtime/catalog.json'
      - 'runtime/catalog.py'
      - 'runtime/providers.py'
      - 'container/manager.py'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'container/**'
      - 'runtime/catalog.json'
      - 'runtime/catalog.py'
      - 'runtime/providers.py'
      - 'container/manager.py'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
    inputs:
      candidate_provider:
        description: Catalog provider to publish under an immutable candidate tag
        required: true
        default: wine
        type: string
      candidate_version:
        description: Exact catalog version to publish under an immutable candidate tag
        required: true
        default: '11.0'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pelagians

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build matrix from runtime catalog
        id: catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_PROVIDER: ${{ inputs.candidate_provider }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          MATRIX="$(python3 -m runtime.catalog --ci-matrix)"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            MATRIX="$(printf '%s' "$MATRIX" | python3 -c '
          import json, os, sys
          matrix = json.load(sys.stdin)
          rows = [row for row in matrix["include"] if row["provider"] == os.environ["CANDIDATE_PROVIDER"] and row["version"] == os.environ["CANDIDATE_VERSION"]]
          if len(rows) != 1:
              raise SystemExit(f"expected exactly one candidate row, found {len(rows)}")
          print(json.dumps({"include": rows}, separators=(",", ":")))
          ' )"
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Runtime catalog matrix:"
          echo "${MATRIX}" | python3 -m json.tool

  build:
    runs-on: ubuntu-latest
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.provider }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.event_name != 'workflow_dispatch' && matrix.published_ref || '' }}
            ${{ github.event_name != 'workflow_dispatch' && matrix.published_alias_refs || '' }}
            ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ github.sha }}-${{ matrix.tag }}
          build-args: |
            ${{ matrix.build_arg }}

# workflow to build and push Cage runtime container images to ghcr.io
name: Build Cage Runtime Containers

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
      - 'tests/*shell*'
      - 'runtime/catalog.json'
      - 'runtime/catalog.py'
      - 'runtime/providers.py'
      - 'container/manager.py'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'container/**'
      - 'tests/*shell*'
      - 'runtime/catalog.json'
      - 'runtime/catalog.py'
      - 'runtime/providers.py'
      - 'container/manager.py'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
    inputs:
      candidate_provider:
        description: Catalog provider to publish under an immutable candidate tag
        required: true
        default: wine
        type: string
      candidate_version:
        description: Exact catalog version to publish under an immutable candidate tag
        required: true
        default: '11.0'
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/pelagians

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      any: ${{ steps.catalog.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate build matrix from runtime catalog
        id: catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          CANDIDATE_PROVIDER: ${{ inputs.candidate_provider }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          base=''
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            MATRIX="$(python3 -m runtime.ci_selection --candidate-provider "$CANDIDATE_PROVIDER" --candidate-version "$CANDIDATE_VERSION")"
          else
            if [[ "$EVENT_NAME" == pull_request ]]; then base="$PR_BASE"; else base="$PUSH_BASE"; fi
            MATRIX="$(python3 -m runtime.ci_selection --base "$base")"
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [[ "$MATRIX" == '{"include":[]}' ]]; then echo 'any=false' >> "$GITHUB_OUTPUT"; else echo 'any=true' >> "$GITHUB_OUTPUT"; fi
          echo "Runtime catalog matrix:"
          echo "${MATRIX}" | python3 -m json.tool

  build:
    runs-on: ubuntu-latest
    needs: catalog
    if: needs.catalog.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate ${{ matrix.provider }}:${{ matrix.version }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && format('{0}/{1}:{2}-{3}', env.REGISTRY, matrix.image_name, github.event.pull_request.head.sha, matrix.tag) || format('{0}/{1}:candidate-{2}-{3}-{4}', env.REGISTRY, matrix.image_name, github.run_id, github.run_attempt, matrix.tag) }}
          build-args: |
            ${{ matrix.build_arg }}
            WINE_CHANNEL=${{ matrix.provider == 'staging' && 'staging' || 'stable' }}

      - name: Select exact image under test
        id: image
        env:
          LOCAL_TAG: ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ github.event.pull_request.head.sha }}-${{ matrix.tag }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            image="$LOCAL_TAG"
          else
            image='${{ env.REGISTRY }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}'
            docker pull "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Smoke actual Labwc environment import
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/cage-labwc-${{ matrix.provider }}-${{ matrix.version }}"
          mkdir -p "$output"
          script='test "${CAGE_LABWC_SESSION_SENTINEL:-}" = actual-s6-environment && printf "%s\n" "$CAGE_LABWC_SESSION_SENTINEL" > /exports/labwc-environment-imported'
          encoded="$(printf '%s' "$script" | base64 -w0)"
          timeout 120 docker run --rm \
            --shm-size 2g \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -e CAGE_SESSION_MODE=selkies \
            -e CAGE_WINE_GRAPHICS=xwayland \
            -e CAGE_LAUNCH_SCRIPT_B64="$encoded" \
            -e CAGE_LABWC_SESSION_SENTINEL=actual-s6-environment \
            -e CAGE_EXIT_WHEN_DONE=true \
            -v "$output:/exports" \
            "$IMAGE"
          test "$(<"$output/labwc-environment-imported")" = actual-s6-environment

      - name: Smoke Wine window and Shell geometry
        if: matrix.provider != 'umu-proton-ge'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: CONTAINER_ENGINE=docker tests/smoke-shell-runtime.sh "$IMAGE"

      - name: Smoke Wine with rootless Podman
        if: matrix.provider == 'wine' && matrix.version == '11.0'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman_tag="localhost/cage-shell-smoke:${GITHUB_RUN_ID}"
          docker tag "$IMAGE" "$podman_tag"
          docker save "$podman_tag" | podman load
          CONTAINER_ENGINE=podman tests/smoke-shell-runtime.sh "$podman_tag"

      - name: Promote qualified digest to release tags
        if: github.event_name == 'push'
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
          RELEASE_REF: ${{ matrix.published_ref }}
          ALIASES: ${{ matrix.published_alias_refs }}
          COMMIT_TAG: ${{ env.REGISTRY }}/${{ matrix.image_name }}:${{ github.sha }}-${{ matrix.tag }}
        run: |
          set -euo pipefail
          tags=(--tag "$RELEASE_REF" --tag "$COMMIT_TAG")
          while IFS= read -r alias; do
            [[ -z "$alias" ]] || tags+=(--tag "$alias")
          done <<< "$ALIASES"
          docker buildx imagetools create "${tags[@]}" "$IMAGE_UNDER_TEST"
          docker buildx imagetools inspect "$RELEASE_REF" >/dev/null

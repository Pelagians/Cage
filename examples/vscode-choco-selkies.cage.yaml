schemaVersion: cage.app/v0
name: vscode-choco-selkies
version: "0.1.0"

runtime:
  provider: wine
  version: "11.0"
  network: bridge
  wineGraphics: xwayland

launch:
  entrypoint: "C:/Program Files/Microsoft VS Code/Code.exe"
  env:
    WINEDEBUG: "-all"

modules:
  - type: chocolatey
    install:
      packages:
        - visualstudio.code

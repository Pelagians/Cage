  - type: check
    file:
      path: C:/MyHarmony/MyHarmony.exe
      exists: true
      sha256: 0a4602a22e0d9e5bdc3ae0a7720652271dfe4e51c8cc8039135f68f89f523a3e
launch:
  entrypoint: C:/MyHarmony/MyHarmony.exe
  workingDirectory: C:/MyHarmony
desktop:
  id: io.github.Pelagians.Cage.MyHarmony
  name: Logitech MyHarmony
  summary: Configure Logitech Harmony remotes and hubs
  license: LicenseRef-Proprietary
  homepage: https://app.myharmony.com/
  categories:
    - Utility
  documentsDirectory: CageMyHarmony
id: io.github.Pelagians.Cage.MyHarmony
execution:
  environment: local-desktop
  targets:
    - oci
    - flatpak
    - appimage
  fallbacks: []
permissions:
  requests:
    # Broad native network grant: host IP/loopback and abstract Unix sockets.
    - id: online-service
      kind: network
      reason: Load the Logitech interface and account services.
      required: true
    - id: app-window
      kind: display
      reason: Show MyHarmony in a normal application window.
      required: true
      backend: x11
    - id: harmony-files
      kind: filesystem
      reason: Save user-requested Harmony files.
      required: false
      location:
        base: xdg-documents
        path: Harmony
      access: read-write
      create: true
      wineDrive: H
    - id: all-devices
      kind: device-class
      reason: Use connected Harmony devices through the explicitly broad compatibility path.
      required: true
      class: all
      hotplug: required

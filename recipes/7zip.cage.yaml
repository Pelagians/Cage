schemaVersion: cage.app/v0
name: 7zip
version: "0.1.0"

runtime:
  provider: wine
  version: "11.0"
  network: none
  wineGraphics: xwayland

build:
  network: bridge

modules:
  - type: chocolatey
    install:
      packages:
        - 7zip.install

launch:
  entrypoint: C:/Program Files/7-Zip/7zFM.exe

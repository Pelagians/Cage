schemaVersion: cage.app/v0
name: notepadplusplus-portable
version: "8.8.8"
runtime:
  provider: wine
  version: "11.0"
  network: none
  wineGraphics: xwayland
sources:
  - id: portable
    type: archive
    policy: redistributable
    path: sources/npp.8.8.8.portable.x64.zip
    url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.8.8/npp.8.8.8.portable.x64.zip
    sha256: b8bc370b76653c194caf32450056030be580b9fa97348fb31b2e2e61ee8d2393
modules:
  - type: files
    mappings:
      - source: sources/notepadplusplus-portable/media
        target: C:/Program Files/Notepad++
        mode: merge
        exclude: [updater]
launch:
  entrypoint: C:/Program Files/Notepad++/notepad++.exe
  workingDirectory: C:/Program Files/Notepad++
  args:
    - -multiInst
    - -nosession
    - -noPlugin
desktop:
  id: io.github.Pelagians.Cage.NotepadPlusPlus
  name: Notepad++ Cage POC
  summary: Pinned portable Notepad++ with an isolated Wine environment
  license: GPL-3.0-only
  homepage: https://notepad-plus-plus.org/
  categories:
    - Utility
    - TextEditor
  documentsDirectory: Cage
  updates:
    profile: notepadplusplus-portable/v1
    settings:
      - drive_c/users/*/AppData/Roaming/Notepad++
    documents:
      - drive_c/users/*/Documents
